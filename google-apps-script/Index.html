<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project 39</title><style>body{font-family:Arial,sans-serif;background:#f4f7f5;margin:0;color:#173d2b}header{background:#173d2b;color:#fff;padding:18px 22px}main{max-width:1200px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card,section{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}.card b{font-size:28px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button{background:#17633f;color:#fff;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}section{display:none}section.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccd8d0;border-radius:8px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:8px;border-bottom:1px solid #e3e8e5;text-align:left;font-size:13px}.pass{color:#0a7b3e}.wait{color:#9a6500}.note{background:#eef6f0;padding:12px;border-left:4px solid #17633f;margin:10px 0}@media(max-width:700px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cards,.grid{grid-template-columns:1fr}}</style></head><body><header><b>บ้านแห่งรอยยิ้ม — Project 39</b><br>สมาชิก → Gate 01 PASS → เปิดสิทธิ์ → อาชีพ → Product → ร้านค้า/ตลาด → รายรับ → Evidence</header><main><div id="cards" class="cards"></div><nav><button onclick="tab('dash')">Dashboard</button><button onclick="tab('gate')">Gate 01</button><button onclick="tab('journey')">Journey</button><button onclick="tab('sales')">รายรับ</button><button onclick="load()">↻ รีเฟรช</button></nav><section id="dash" class="active"><h2>Executive Dashboard</h2><div id="summary"></div></section><section id="gate"><h2>Gate 01</h2><div class="note"><b>PASS = 7 เงื่อนไข:</b> ตรวจแล้ว + พื้นที่ + อาชีพ + ผู้ตรวจ + วันที่ตรวจ + Evidence + ไม่มีข้อมูลค้างแก้ไข</div><div id="memberTable"></div></section><section id="journey"><h2>เปิดสิทธิ์ Journey</h2><div class="grid"><select id="jm"></select><input id="jo" placeholder="อาชีพ"><select id="jp"></select><input id="jh" placeholder="ShopID/ตลาด (ถ้ามี)"></div><br><button onclick="saveJourney()">เปิด Journey</button></section><section id="sales"><h2>บันทึกรายรับ</h2><div class="grid"><select id="sm"></select><select id="sp"></select><input id="sd" type="date"><input id="sq" type="number" placeholder="จำนวน"><input id="su" type="number" step=".01" placeholder="ราคาต่อหน่วย"><input id="se" placeholder="Evidence ID"></div><br><button onclick="saveSale()">บันทึกรายรับ</button></section></main><script>
let D={};function gate(m){return m.GateStatus==='ตรวจแล้ว'&&m.Village&&m.Occupation&&m.GateInspector&&m.GateVerifiedAt&&m.GateEvidenceID&&!m.GateMissingInfo}function tab(id){document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function load(){google.script.run.withSuccessHandler(x=>{D=x;render()}).withFailureHandler(e=>alert(e.message)).getAppData()}function render(){const p=D.members.filter(gate),rev=D.sales.reduce((a,x)=>a+(Number(x.Revenue)||0),0);cards.innerHTML=[['สมาชิก',D.members.length],['Gate PASS',p.length],['ต้องแก้',D.members.length-p.length],['Journey',D.journey.length],['รายรับ',rev.toLocaleString()+' บาท']].map(x=>'<div class="card">'+x[0]+'<br><b>'+x[1]+'</b></div>').join('');summary.innerHTML='<p>สมาชิกทั้งหมด <b>'+D.members.length+'</b> คน</p><p>Gate 01 PASS <b>'+p.length+'</b> คน</p><p>ยังไม่ผ่าน/ต้องแก้ <b>'+(D.members.length-p.length)+'</b> คน</p><p>รายรับที่บันทึก <b>'+rev.toLocaleString()+'</b> บาท</p>';memberTable.innerHTML='<table><tr><th>ID</th><th>สมาชิก</th><th>พื้นที่</th><th>อาชีพ</th><th>Gate</th><th>Evidence</th></tr>'+D.members.map(m=>'<tr><td>'+m.MemberID+'</td><td>'+m.FullName+'</td><td>'+m.Village+'</td><td>'+m.Occupation+'</td><td class="'+(gate(m)?'pass':'wait')+'">'+(gate(m)?'PASS':'ต้องตรวจ/แก้')+'</td><td>'+ (m.GateEvidenceID||'-')+'</td></tr>').join('')+'</table>';const mo=p.map(m=>'<option value="'+m.MemberID+'">'+m.MemberID+' — '+m.FullName+'</option>').join('');jm.innerHTML=sm.innerHTML=mo;const po=D.products.map(x=>'<option value="'+x.ProductID+'">'+x.ProductID+' — '+x.ProductName+'</option>').join('');jp.innerHTML=sp.innerHTML=po}function saveJourney(){google.script.run.withSuccessHandler(x=>{D=x;render();alert('เปิด Journey สำเร็จ')}).withFailureHandler(e=>alert(e.message)).createJourney({MemberID:jm.value,Occupation:jo.value,ProductID:jp.value,ShopID:jh.value})}function saveSale(){google.script.run.withSuccessHandler(x=>{D=x;render();alert('บันทึกรายรับสำเร็จ')}).withFailureHandler(e=>alert(e.message)).createSale({MemberID:sm.value,ProductID:sp.value,SaleDate:sd.value,Qty:sq.value,UnitPrice:su.value,EvidenceID:se.value})}load();
</script></body></html>
